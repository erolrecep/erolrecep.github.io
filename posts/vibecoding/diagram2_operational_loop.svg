<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <style>
      .group-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .node-box { rx: 8px; ry: 8px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.03)); stroke-width: 1.2px; }
      .arrow { stroke-width: 2; fill: none; }
      .label-bg { rx: 4px; ry: 4px; fill: #ffffff; stroke: #e2e8f0; stroke-width: 1px; }
      .label-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626" />
    </marker>
    <marker id="arrow-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569" />
    </marker>
  </defs>

  <!-- Container: Human Researcher -->
  <rect x="30" y="30" width="380" height="550" rx="12" ry="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="50" y="60" class="group-title" fill="#334155">Human Researcher (Domain Authority)</text>

  <!-- Node H1 -->
  <rect x="50" y="85" width="340" height="90" class="node-box" fill="#ffffff" stroke="#94a3b8" />
  <text x="70" y="115" class="node-title">1. Formulate Declarative Intent</text>
  <text x="70" y="137" class="node-desc">• Problem constraints &amp; domain boundaries</text>
  <text x="70" y="155" class="node-desc">• Data schema &amp; mathematical invariants</text>

  <!-- Node H2 -->
  <rect x="50" y="440" width="340" height="105" class="node-box" fill="#ffffff" stroke="#94a3b8" />
  <text x="70" y="470" class="node-title">4. Verification &amp; Epistemic Appraisal</text>
  <text x="70" y="492" class="node-desc">• Check domain assumptions &amp; edge cases</text>
  <text x="70" y="510" class="node-desc">• Critical appraisal of empirical outputs</text>
  <text x="70" y="528" class="node-desc">• Formulate next research hypothesis</text>

  <!-- Container: Foundation Model -->
  <rect x="500" y="30" width="390" height="260" rx="12" ry="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
  <text x="520" y="60" class="group-title" fill="#15803d">Foundation Model / Agent Engine</text>

  <!-- Node A1 -->
  <rect x="520" y="85" width="350" height="80" class="node-box" fill="#ffffff" stroke="#86efac" />
  <text x="540" y="115" class="node-title">2. Generative Synthesis</text>
  <text x="540" y="137" class="node-desc">• Code, test harnesses &amp; virtual env manifests</text>
  <text x="540" y="155" class="node-desc">• Architecture topology &amp; pipeline scripts</text>

  <!-- Node A2 -->
  <rect x="520" y="185" width="350" height="85" class="node-box" fill="#ffffff" stroke="#86efac" />
  <text x="540" y="215" class="node-title">5. Diagnostic Triage &amp; Refactoring</text>
  <text x="540" y="237" class="node-desc">• Ingest tracebacks &amp; error logs</text>
  <text x="540" y="255" class="node-desc">• Patch logic bugs &amp; optimize bottlenecks</text>

  <!-- Container: Runtime Environment -->
  <rect x="500" y="320" width="390" height="260" rx="12" ry="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
  <text x="520" y="350" class="group-title" fill="#b91c1c">Runtime &amp; Execution Sandbox</text>

  <!-- Node R1 -->
  <rect x="520" y="375" width="350" height="170" class="node-box" fill="#ffffff" stroke="#fca5a5" />
  <text x="540" y="410" class="node-title">3. Runtime Execution &amp; Test Suite</text>
  <text x="540" y="435" class="node-desc">• Execute test fixtures &amp; assertions</text>
  <text x="540" y="455" class="node-desc">• Static linters &amp; type checkers (ruff, mypy)</text>
  <text x="540" y="475" class="node-desc">• Sandbox execution of scientific data pipelines</text>
  <text x="540" y="495" class="node-desc">• Local server runtime (Streamlit, Flask, CLI)</text>

  <!-- Connectors -->
  <!-- H1 -> A1 -->
  <path d="M 390 125 L 515 125" class="arrow" stroke="#2563eb" marker-end="url(#arrow-blue)" />
  <rect x="408" y="112" width="94" height="22" class="label-bg" />
  <text x="455" y="127" class="label-text" fill="#2563eb">Specify Prompt</text>

  <!-- A1 -> R1 -->
  <path d="M 695 165 L 695 370" class="arrow" stroke="#16a34a" marker-end="url(#arrow-green)" />
  <rect x="635" y="295" width="120" height="22" class="label-bg" />
  <text x="695" y="310" class="label-text" fill="#16a34a">Emit Code &amp; Tests</text>

  <!-- R1 -> H2 -->
  <path d="M 520 490 L 395 490" class="arrow" stroke="#475569" marker-end="url(#arrow-slate)" />
  <rect x="410" y="477" width="90" height="22" class="label-bg" />
  <text x="455" y="492" class="label-text" fill="#334155">Data &amp; Artifacts</text>

  <!-- R1 -> A2 -->
  <path d="M 740 375 L 740 275" class="arrow" stroke="#dc2626" marker-end="url(#arrow-red)" />
  <rect x="745" y="310" width="130" height="22" class="label-bg" />
  <text x="810" y="325" class="label-text" fill="#dc2626">Tracebacks / Errors</text>

  <!-- H2 -> H1 (Feedback loop) -->
  <path d="M 50 490 C 10 490 10 125 45 125" class="arrow" stroke="#94a3b8" marker-end="url(#arrow-slate)" />
  <rect x="0" y="295" width="95" height="22" class="label-bg" />
  <text x="47" y="310" class="label-text" fill="#64748b">Iterate Intent</text>
</svg>
