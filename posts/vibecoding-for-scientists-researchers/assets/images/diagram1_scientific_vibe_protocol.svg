<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="100%" height="100%">
  <defs>
    <style>
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; }
      .stage-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #475569; }
      .arrow { stroke: #94a3b8; stroke-width: 2.5; fill: none; marker-end: url(#arrow-gray); }
      .loop-arrow { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 5,5; fill: none; marker-end: url(#arrow-gray); }
      .loop-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-style: italic; fill: #64748b; }
      .stage-card { rx: 10px; ry: 10px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.03)); stroke-width: 1.5px; }
    </style>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Stage 1 -->
  <rect x="80" y="20" width="720" height="95" class="stage-card" fill="#ffffff" stroke="#94a3b8" />
  <rect x="80" y="20" width="8" height="95" rx="4" ry="0" fill="#475569" />
  <text x="105" y="47" class="stage-title" fill="#1e293b">Stage 1: Invariant &amp; Constraint Specification (Formal Domain Grounding)</text>
  <text x="105" y="70" class="stage-desc">• Define physical units, parameter bounds, and conservation laws (mass, energy, momentum)</text>
  <text x="105" y="90" class="stage-desc">• Explicitly declare missing-data semantics, matrix topologies, and boundary conditions</text>

  <path d="M 440 115 L 440 145" class="arrow" />

  <!-- Stage 2 -->
  <rect x="80" y="150" width="720" height="95" class="stage-card" fill="#ffffff" stroke="#fca5a5" />
  <rect x="80" y="150" width="8" height="95" rx="4" ry="0" fill="#dc2626" />
  <text x="105" y="177" class="stage-title" fill="#b91c1c">Stage 2: Zero-Trust Synthetic Benchmarking (Ground-Truth Calibration)</text>
  <text x="105" y="200" class="stage-desc">• Generate synthetic mock data with known analytical / closed-form solutions</text>
  <text x="105" y="220" class="stage-desc">• Enforce automated property tests: prove solver recovers ground truth BEFORE touching real data</text>

  <path d="M 440 245 L 440 275" class="arrow" />

  <!-- Stage 3 -->
  <rect x="80" y="280" width="720" height="95" class="stage-card" fill="#ffffff" stroke="#93c5fd" />
  <rect x="80" y="280" width="8" height="95" rx="4" ry="0" fill="#2563eb" />
  <text x="105" y="307" class="stage-title" fill="#1d4ed8">Stage 3: Numerical Synthesis &amp; Vectorization (Performant Computing)</text>
  <text x="105" y="330" class="stage-desc">• Synthesize performant kernels using modern scientific libraries (NumPy, SciPy, JAX, PyTorch)</text>
  <text x="105" y="350" class="stage-desc">• Enforce memory profiling and hardware acceleration (Apple Silicon Accelerate / GPU CUDA)</text>

  <path d="M 440 375 L 440 405" class="arrow" />

  <!-- Stage 4 -->
  <rect x="80" y="410" width="720" height="95" class="stage-card" fill="#ffffff" stroke="#86efac" />
  <rect x="80" y="410" width="8" height="95" rx="4" ry="0" fill="#16a34a" />
  <text x="105" y="437" class="stage-title" fill="#15803d">Stage 4: Interactive Micro-Dashboards (Exploratory Instrumentation)</text>
  <text x="105" y="460" class="stage-desc">• Scaffold single-file local reactive web UIs (Streamlit / Panel / Gradio)</text>
  <text x="105" y="480" class="stage-desc">• Dynamic parameter-sweep sliders for real-time intuition during lab group meetings</text>

  <path d="M 440 505 L 440 535" class="arrow" />

  <!-- Stage 5 -->
  <rect x="80" y="540" width="720" height="95" class="stage-card" fill="#ffffff" stroke="#d8b4fe" />
  <rect x="80" y="540" width="8" height="95" rx="4" ry="0" fill="#9333ea" />
  <text x="105" y="567" class="stage-title" fill="#7e22ce">Stage 5: Provenance &amp; Reproducibility Locking (Archival Integrity)</text>
  <text x="105" y="590" class="stage-desc">• Deterministic environment locking via uv.lock, Singularity, or Docker containerization</text>
  <text x="105" y="610" class="stage-desc">• Commit interaction transcripts, random seeds, and model checkpoints to Git / Zenodo</text>

  <!-- Feedback Loop -->
  <path d="M 80 588 C 20 588 20 67 75 67" class="loop-arrow" />
  <rect x="5" y="325" width="65" height="40" rx="4" ry="4" fill="#ffffff" stroke="#e2e8f0" />
  <text x="37" y="342" text-anchor="middle" class="loop-text">Iterate</text>
  <text x="37" y="356" text-anchor="middle" class="loop-text">Hypothesis</text>
</svg>
