<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <style>
      .lifeline { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .actor-box { rx: 10px; ry: 10px; stroke-width: 1.5px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04)); }
      .actor-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .actor-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; text-anchor: middle; }
      .seq-arrow { stroke-width: 2; fill: none; }
      .seq-arrow-dash { stroke-width: 2; stroke-dasharray: 5,4; fill: none; }
      .seq-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 600; }
      .seq-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .num-badge { rx: 9px; ry: 9px; }
      .phase-rect { rx: 8px; ry: 8px; stroke-width: 1.2px; }
      .phase-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 800; letter-spacing: 0.6px; }
    </style>
    <marker id="arrow-blue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#2563eb" />
    </marker>
    <marker id="arrow-emerald" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#059669" />
    </marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#7c3aed" />
    </marker>
    <marker id="arrow-dark" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1e293b" />
    </marker>
  </defs>

  <!-- Lifelines -->
  <line x1="160" y1="80" x2="160" y2="475" class="lifeline" />
  <line x1="450" y1="80" x2="450" y2="475" class="lifeline" />
  <line x1="740" y1="80" x2="740" y2="475" class="lifeline" />

  <!-- Actor 1: Scientist -->
  <rect x="60" y="22" width="200" height="56" class="actor-box" fill="#f8fafc" stroke="#64748b" />
  <text x="160" y="45" class="actor-title" fill="#1e293b">Human Scientist</text>
  <text x="160" y="63" class="actor-sub" fill="#64748b">Domain Authority &amp; Invariant Arbiter</text>

  <!-- Actor 2: Agent (RSE) -->
  <rect x="350" y="22" width="200" height="56" class="actor-box" fill="#eff6ff" stroke="#3b82f6" />
  <text x="450" y="45" class="actor-title" fill="#1d4ed8">LLM Agent (RSE)</text>
  <text x="450" y="63" class="actor-sub" fill="#2563eb">Agile Research Software Engineer</text>

  <!-- Actor 3: Runtime Engine -->
  <rect x="640" y="22" width="200" height="56" class="actor-box" fill="#f0fdf4" stroke="#22c55e" />
  <text x="740" y="45" class="actor-title" fill="#15803d">Execution Sandbox</text>
  <text x="740" y="63" class="actor-sub" fill="#16a34a">Unit Test &amp; Compiler Runtime</text>

  <!-- ================= PHASE 1: SYNTHETIC BENCHMARK ================= -->
  <rect x="70" y="98" width="760" height="186" class="phase-rect" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="92" y="120" class="phase-header" fill="#64748b">PHASE 1: ZERO-TRUST SYNTHETIC BENCHMARK</text>

  <!-- Msg 1: Scientist -> Agent (Label cleanly placed above arrow) -->
  <rect x="175" y="132" width="18" height="18" class="num-badge" fill="#2563eb" />
  <text x="184" y="141" class="seq-num">1</text>
  <text x="201" y="145" class="seq-label" fill="#1e293b">Generate synthetic data with known ground-truth ODE solution</text>
  <path d="M 160 157 L 442 157" class="seq-arrow" stroke="#2563eb" marker-end="url(#arrow-blue)" />

  <!-- Msg 2: Agent -> Engine -->
  <rect x="465" y="167" width="18" height="18" class="num-badge" fill="#059669" />
  <text x="474" y="176" class="seq-num">2</text>
  <text x="491" y="180" class="seq-label" fill="#1e293b">Execute parameter-recovery unit tests against ground truth</text>
  <path d="M 450 192 L 732 192" class="seq-arrow" stroke="#059669" marker-end="url(#arrow-emerald)" />

  <!-- Msg 3: Engine -> Agent -->
  <rect x="465" y="202" width="18" height="18" class="num-badge" fill="#059669" />
  <text x="474" y="211" class="seq-num">3</text>
  <text x="491" y="215" class="seq-label" fill="#047857">Analytical relative error &lt; 1e-6 (TEST PASSED)</text>
  <path d="M 740 227 L 458 227" class="seq-arrow-dash" stroke="#059669" marker-end="url(#arrow-emerald)" />

  <!-- Msg 4: Agent -> Scientist -->
  <rect x="175" y="237" width="18" height="18" class="num-badge" fill="#2563eb" />
  <text x="184" y="246" class="seq-num">4</text>
  <text x="201" y="250" class="seq-label" fill="#1d4ed8">Synthetic benchmark certified: solver logic verified</text>
  <path d="M 450 262 L 168 262" class="seq-arrow-dash" stroke="#2563eb" marker-end="url(#arrow-blue)" />

  <!-- ================= PHASE 2: EMPIRICAL OBSERVATION INGESTION ================= -->
  <rect x="70" y="296" width="760" height="182" class="phase-rect" fill="#fdf4ff" stroke="#f0abfc" />
  <text x="92" y="318" class="phase-header" fill="#a855f7">PHASE 2: EMPIRICAL OBSERVATION INGESTION</text>

  <!-- Msg 5: Scientist -> Agent -->
  <rect x="175" y="330" width="18" height="18" class="num-badge" fill="#7c3aed" />
  <text x="184" y="339" class="seq-num">5</text>
  <text x="201" y="343" class="seq-label" fill="#581c87">Ingest noisy experimental observations (e.g. sample_42.csv)</text>
  <path d="M 160 355 L 442 355" class="seq-arrow" stroke="#7c3aed" marker-end="url(#arrow-purple)" />

  <!-- Msg 6: Agent -> Engine -->
  <rect x="465" y="365" width="18" height="18" class="num-badge" fill="#7c3aed" />
  <text x="474" y="374" class="seq-num">6</text>
  <text x="491" y="378" class="seq-label" fill="#581c87">Run calibrated solver with invariant checks on empirical data</text>
  <path d="M 450 390 L 732 390" class="seq-arrow" stroke="#7c3aed" marker-end="url(#arrow-purple)" />

  <!-- Msg 7: Engine -> Scientist -->
  <rect x="175" y="405" width="18" height="18" class="num-badge" fill="#1e293b" />
  <text x="184" y="414" class="seq-num">7</text>
  <text x="201" y="418" class="seq-label" fill="#0f172a" font-weight="700">Scientifically Validated Inferences, Invariant Logs &amp; Error Bounds</text>
  <path d="M 740 432 L 168 432" class="seq-arrow-dash" stroke="#1e293b" marker-end="url(#arrow-dark)" />
</svg>
