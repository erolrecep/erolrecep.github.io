<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <style>
      .domain-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .domain-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; text-anchor: middle; }
      .case-card { rx: 12px; ry: 12px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04)); stroke-width: 1.5px; }
      .bullet-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; }
      .bullet-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .bridge-line { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrow-slate); }
      .bridge-badge { rx: 4px; ry: 4px; fill: #ffffff; stroke: #cbd5e1; stroke-width: 1px; }
      .bridge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; font-weight: 600; fill: #64748b; text-anchor: middle; }
    </style>
    <marker id="arrow-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Domain 1: Life Sciences -->
  <rect x="25" y="20" width="280" height="240" class="case-card" fill="#ffffff" stroke="#93c5fd" />
  <rect x="25" y="20" width="280" height="48" rx="12" ry="12" fill="#eff6ff" />
  <rect x="25" y="56" width="280" height="12" fill="#eff6ff" />
  <text x="165" y="42" class="domain-title" fill="#1d4ed8">Life Sciences &amp; Genomics</text>
  <text x="165" y="58" class="domain-sub" fill="#3b82f6">Single-Cell RNA-seq QC</text>

  <text x="45" y="95" class="bullet-title" fill="#1e293b">Empirical Challenge:</text>
  <text x="45" y="115" class="bullet-text">• 50,000+ noisy single-cell profiles</text>
  <text x="45" y="133" class="bullet-text">• Manual batch-effect thresholding</text>
  
  <text x="45" y="165" class="bullet-title" fill="#1e293b">Vibe Coding Acceleration:</text>
  <text x="45" y="185" class="bullet-text">• Reactive Streamlit QC micro-app</text>
  <text x="45" y="203" class="bullet-text">• Real-time UMAP quantile filtering</text>
  <text x="45" y="221" class="bullet-text">• <b>Slashes cycle from 3 days to 20m</b></text>

  <!-- Bridge 1 -> 2 -->
  <path d="M 305 140 L 335 140" class="bridge-line" />

  <!-- Domain 2: Physical Sciences -->
  <rect x="340" y="20" width="280" height="240" class="case-card" fill="#ffffff" stroke="#86efac" />
  <rect x="340" y="20" width="280" height="48" rx="12" ry="12" fill="#f0fdf4" />
  <rect x="340" y="56" width="280" height="12" fill="#f0fdf4" />
  <text x="480" y="42" class="domain-title" fill="#15803d">Applied Physics &amp; Chemistry</text>
  <text x="480" y="58" class="domain-sub" fill="#16a34a">Nonlinear Reaction Kinetics</text>

  <text x="360" y="95" class="bullet-title" fill="#1e293b">Empirical Challenge:</text>
  <text x="360" y="115" class="bullet-text">• Stiff coupled ODE networks</text>
  <text x="360" y="133" class="bullet-text">• Hand-coded Jacobians fail/diverge</text>
  
  <text x="360" y="165" class="bullet-title" fill="#1e293b">Vibe Coding Acceleration:</text>
  <text x="360" y="185" class="bullet-text">• Symbolic SymPy Jacobian derivation</text>
  <text x="360" y="203" class="bullet-text">• Vectorized JAX Radau integrator</text>
  <text x="360" y="221" class="bullet-text">• <b>Guaranteed numerical stability</b></text>

  <!-- Bridge 2 -> 3 -->
  <path d="M 620 140 L 650 140" class="bridge-line" />

  <!-- Domain 3: Computational Social Sciences -->
  <rect x="655" y="20" width="280" height="240" class="case-card" fill="#ffffff" stroke="#d8b4fe" />
  <rect x="655" y="20" width="280" height="48" rx="12" ry="12" fill="#faf5ff" />
  <rect x="655" y="56" width="280" height="12" fill="#faf5ff" />
  <text x="795" y="42" class="domain-title" fill="#7e22ce">Computational Social Science</text>
  <text x="795" y="58" class="domain-sub" fill="#9333ea">Historical Corpus Text Mining</text>

  <text x="675" y="95" class="bullet-title" fill="#1e293b">Empirical Challenge:</text>
  <text x="675" y="115" class="bullet-text">• Unstructured archival transcripts</text>
  <text x="675" y="133" class="bullet-text">• Manual entity coding is intractable</text>
  
  <text x="675" y="165" class="bullet-title" fill="#1e293b">Vibe Coding Acceleration:</text>
  <text x="675" y="185" class="bullet-text">• Structured JSON relational extraction</text>
  <text x="675" y="203" class="bullet-text">• Gold-standard Cohen's kappa check</text>
  <text x="675" y="221" class="bullet-text">• <b>Quantifiable precision &amp; recall</b></text>
</svg>
